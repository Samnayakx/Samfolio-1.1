  <script>
    // The site's theme, applied before first paint so the page never flashes the wrong ground
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="/css/site.css" />

  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .lab-page { position: fixed; inset: 0; }
    .lab-page__title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .lab-page__fallback { margin: 0; padding: 32px; font: 400 16px/1.5 var(--font-body, system-ui, sans-serif); }
  </style>
</head>
<body data-page="motion-lab">
  <main class="lab-page" id="lab">
    <h1 class="lab-page__title">Motion Lab</h1>
    <noscript><p class="lab-page__fallback">Motion Lab runs in the browser and needs JavaScript. <a href="/playground">Back to the playground</a>.</p></noscript>
  </main>
  <script src="/js/playground.js"></script>
  <script>
    // Laid out for real on a wide screen; below that the same lab is scaled to fill the window
    window.Playground.DEMOS.motionLab(document.getElementById("lab"), { auto: false, full: innerWidth >= 1360, bleed: true });
  </script>
